name: Build Kindle digests

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: Hours of articles to include in this test build
        required: false
        default: "168"
  push:
    branches:
      - kindle-digest
    paths:
      - "feeds.yaml"
      - "kindle_digest.py"
      - "requirements.txt"
      - ".github/workflows/build-kindle-digests.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '168' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build EPUBs
        run: python kindle_digest.py --lookback-hours "$LOOKBACK_HOURS"

      - name: Upload test EPUBs
        uses: actions/upload-artifact@v4
        with:
          name: kindle-digests
          path: dist/*.epub
          if-no-files-found: error
          retention-days: 7
